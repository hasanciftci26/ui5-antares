name: Open Pull Request on Push

on:
  push:
    branches:
      - '1.124.1*'
      - '1.124.999*'
      - '1.123.2*'
      - '1.123.1*'
      - '1.120.15*'
      - '1.120.14*'
      - '1.120.13*'
      - '1.120.12*'
      - '1.120.11*'
      - '1.120.1*'
      - '1.108.32*'
      - '1.108.31*'
      - '1.108.30*'
      - '1.108.23*'
      - '1.96.33*'
      - '1.96.32*'
      - '1.96.31*'
      - '1.96.30*'
      - '1.96.25*'

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v3

    - name: Set up GitHub CLI
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install GitHub CLI
      run: |
        sudo apt-get update
        sudo apt-get install gh

    - name: Determine Target Branch
      id: determine-branch
      run: |
        BRANCH_NAME=$(echo $GITHUB_REF | sed 's|refs/heads/||')
        echo "SOURCE_BRANCH=$BRANCH_NAME" >> $GITHUB_ENV
        if [[ "$BRANCH_NAME" == 1.124.1* ]]; then
          echo "TARGET_BRANCH=1.124.1-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.124.999* ]]; then
          echo "TARGET_BRANCH=1.124.999-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.123.2* ]]; then
          echo "TARGET_BRANCH=1.123.2-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.123.1* ]]; then
          echo "TARGET_BRANCH=1.123.1-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.120.15* ]]; then
          echo "TARGET_BRANCH=1.120.15-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.120.14* ]]; then
          echo "TARGET_BRANCH=1.120.14-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.120.13* ]]; then
          echo "TARGET_BRANCH=1.120.13-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.120.12* ]]; then
          echo "TARGET_BRANCH=1.120.12-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.120.11* ]]; then
          echo "TARGET_BRANCH=1.120.11-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.120.1* ]]; then
          echo "TARGET_BRANCH=1.120.1-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.108.32* ]]; then
          echo "TARGET_BRANCH=1.108.32-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.108.31* ]]; then
          echo "TARGET_BRANCH=1.108.31-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.108.30* ]]; then
          echo "TARGET_BRANCH=1.108.30-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.108.23* ]]; then
          echo "TARGET_BRANCH=1.108.23-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.96.33* ]]; then
          echo "TARGET_BRANCH=1.96.33-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.96.32* ]]; then
          echo "TARGET_BRANCH=1.96.32-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.96.31* ]]; then
          echo "TARGET_BRANCH=1.96.31-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.96.30* ]]; then
          echo "TARGET_BRANCH=1.96.30-latest" >> $GITHUB_ENV
        elif [[ "$BRANCH_NAME" == 1.96.25* ]]; then
          echo "TARGET_BRANCH=1.96.25-latest" >> $GITHUB_ENV
        else
          echo "Unsupported branch pattern: $BRANCH_NAME"
          exit 1
        fi

    - name: Create Pull Request
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh pr create --head "$SOURCE_BRANCH" --base "$TARGET_BRANCH" --title "Auto PR: $SOURCE_BRANCH to $TARGET_BRANCH" --body "This pull request was created automatically by GitHub Actions from $SOURCE_BRANCH into $TARGET_BRANCH."